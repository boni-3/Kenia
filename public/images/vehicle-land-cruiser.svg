<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="lcBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5c0"/>
    </linearGradient>
    <linearGradient id="lcBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#30211b"/>
    </linearGradient>
    <linearGradient id="lcGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a882"/>
      <stop offset="100%" stop-color="#b8956e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#lcBg)"/>

  <!-- Subtle dust pattern -->
  <circle cx="100" cy="350" r="150" fill="#d4b896" opacity="0.3"/>
  <circle cx="500" cy="360" r="120" fill="#d4b896" opacity="0.2"/>

  <!-- Ground -->
  <rect x="0" y="320" width="600" height="80" fill="url(#lcGround)" rx="0"/>
  <path d="M0 320 Q150 315 300 320 Q450 325 600 318" fill="none" stroke="#b8956e" stroke-width="2"/>

  <!-- Vehicle shadow -->
  <ellipse cx="300" cy="318" rx="170" ry="12" fill="#8a7560" opacity="0.4"/>

  <!-- Toyota Land Cruiser 70 Series - boxy profile -->
  <g transform="translate(105, 145)">
    <!-- Chassis / Undercarriage -->
    <rect x="30" y="148" width="330" height="12" rx="3" fill="#1a1410"/>

    <!-- Body - main boxy shape -->
    <path d="M45 65 L45 155 L375 155 L375 80 L360 65 L270 65 L260 30 L115 30 L105 65 Z" fill="url(#lcBody)"/>

    <!-- Snorkel (left side, goes up from hood area) -->
    <rect x="50" y="15" width="8" height="55" rx="2" fill="#30211b"/>
    <rect x="47" y="10" width="14" height="10" rx="3" fill="#30211b"/>
    <path d="M47 12 Q54 5 61 12" fill="none" stroke="#4a3525" stroke-width="1.5"/>

    <!-- Roof rack -->
    <rect x="108" y="24" width="158" height="6" rx="2" fill="#5a4535"/>
    <rect x="112" y="20" width="150" height="4" rx="1" fill="#6b5545"/>
    <!-- Rack cross bars -->
    <rect x="130" y="24" width="3" height="6" fill="#6b5545"/>
    <rect x="160" y="24" width="3" height="6" fill="#6b5545"/>
    <rect x="190" y="24" width="3" height="6" fill="#6b5545"/>
    <rect x="220" y="24" width="3" height="6" fill="#6b5545"/>
    <rect x="245" y="24" width="3" height="6" fill="#6b5545"/>

    <!-- Hood -->
    <rect x="270" y="65" width="95" height="50" fill="#3d2b1a"/>
    <line x1="280" y1="70" x2="280" y2="115" stroke="#4a3525" stroke-width="1"/>

    <!-- Windshield -->
    <path d="M258 34 L268 65 L115 65 L120 34 Z" fill="#8b7355" opacity="0.7"/>
    <line x1="188" y1="34" x2="190" y2="65" stroke="#4a3525" stroke-width="1.5"/>

    <!-- Side windows -->
    <rect x="115" y="38" width="48" height="24" rx="2" fill="#8b7355" opacity="0.6"/>
    <rect x="168" y="38" width="48" height="24" rx="2" fill="#8b7355" opacity="0.6"/>
    <rect x="220" y="38" width="38" height="24" rx="2" fill="#8b7355" opacity="0.55"/>

    <!-- Window dividers -->
    <line x1="163" y1="35" x2="163" y2="65" stroke="#30211b" stroke-width="3"/>
    <line x1="216" y1="35" x2="216" y2="65" stroke="#30211b" stroke-width="3"/>

    <!-- Door lines -->
    <line x1="163" y1="65" x2="163" y2="150" stroke="#3d2b1a" stroke-width="1.5"/>
    <line x1="255" y1="65" x2="255" y2="150" stroke="#3d2b1a" stroke-width="1.5"/>

    <!-- Door handles -->
    <rect x="175" y="95" width="15" height="4" rx="2" fill="#5a4535"/>
    <rect x="225" y="95" width="15" height="4" rx="2" fill="#5a4535"/>

    <!-- Fender flares -->
    <path d="M50 120 Q50 100 75 95 Q100 90 120 95 Q140 105 140 120" fill="none" stroke="#30211b" stroke-width="4" stroke-linecap="round"/>
    <path d="M280 120 Q280 100 305 95 Q330 90 350 95 Q370 105 370 120" fill="none" stroke="#30211b" stroke-width="4" stroke-linecap="round"/>

    <!-- Front bumper (bull bar) -->
    <rect x="360" y="75" width="18" height="75" rx="3" fill="#4a3525"/>
    <rect x="365" y="80" width="12" height="10" rx="2" fill="#6b5545"/>
    <rect x="365" y="95" width="12" height="10" rx="2" fill="#6b5545"/>
    <!-- Bull bar tubes -->
    <path d="M378 80 Q390 85 390 100 Q390 115 378 120" fill="none" stroke="#5a4535" stroke-width="3" stroke-linecap="round"/>

    <!-- Headlights -->
    <rect x="363" y="80" width="8" height="12" rx="2" fill="#f5d799" opacity="0.8"/>
    <rect x="363" y="115" width="8" height="8" rx="2" fill="#d4792a" opacity="0.6"/>

    <!-- Rear -->
    <rect x="42" y="75" width="8" height="60" rx="2" fill="#3d2b1a"/>
    <!-- Tail light -->
    <rect x="43" y="80" width="6" height="15" rx="2" fill="#c2442d" opacity="0.7"/>

    <!-- Spare tire on rear -->
    <circle cx="38" cy="110" r="22" fill="#1a1410"/>
    <circle cx="38" cy="110" r="18" fill="#2a2018"/>
    <circle cx="38" cy="110" r="14" fill="#333028"/>
    <circle cx="38" cy="110" r="5" fill="#4a4540"/>

    <!-- Front wheel -->
    <circle cx="330" cy="155" r="28" fill="#1a1410"/>
    <circle cx="330" cy="155" r="23" fill="#2a2018"/>
    <circle cx="330" cy="155" r="18" fill="#333028"/>
    <circle cx="330" cy="155" r="7" fill="#5a5550"/>
    <!-- Wheel detail -->
    <line x1="330" y1="140" x2="330" y2="170" stroke="#4a4540" stroke-width="2"/>
    <line x1="315" y1="155" x2="345" y2="155" stroke="#4a4540" stroke-width="2"/>
    <line x1="319" y1="144" x2="341" y2="166" stroke="#4a4540" stroke-width="2"/>
    <line x1="341" y1="144" x2="319" y2="166" stroke="#4a4540" stroke-width="2"/>

    <!-- Rear wheel -->
    <circle cx="100" cy="155" r="28" fill="#1a1410"/>
    <circle cx="100" cy="155" r="23" fill="#2a2018"/>
    <circle cx="100" cy="155" r="18" fill="#333028"/>
    <circle cx="100" cy="155" r="7" fill="#5a5550"/>
    <line x1="100" y1="140" x2="100" y2="170" stroke="#4a4540" stroke-width="2"/>
    <line x1="85" y1="155" x2="115" y2="155" stroke="#4a4540" stroke-width="2"/>
    <line x1="89" y1="144" x2="111" y2="166" stroke="#4a4540" stroke-width="2"/>
    <line x1="111" y1="144" x2="89" y2="166" stroke="#4a4540" stroke-width="2"/>

    <!-- Step bar -->
    <rect x="140" y="148" width="140" height="4" rx="2" fill="#4a3525"/>
  </g>

  <!-- Label area -->
  <text x="300" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#6b4c30" font-weight="bold" letter-spacing="2">LAND CRUISER 70</text>
</svg>