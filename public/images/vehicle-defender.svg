<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="dfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e4d2"/>
      <stop offset="100%" stop-color="#e0d0ba"/>
    </linearGradient>
    <linearGradient id="dfBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3525"/>
      <stop offset="100%" stop-color="#30211b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#dfBg)"/>
  <circle cx="500" cy="320" r="140" fill="#d4b896" opacity="0.2"/>
  <circle cx="80" cy="370" r="100" fill="#d4b896" opacity="0.15"/>

  <!-- Ground -->
  <rect x="0" y="318" width="600" height="82" fill="#c9a882"/>
  <rect x="0" y="340" width="600" height="60" fill="#b8956e"/>

  <!-- Shadow -->
  <ellipse cx="300" cy="316" rx="165" ry="11" fill="#8a7560" opacity="0.35"/>

  <!-- Land Rover Defender - boxy classic profile -->
  <g transform="translate(105, 130)">
    <!-- Undercarriage -->
    <rect x="30" y="158" width="340" height="12" rx="3" fill="#1a1410"/>

    <!-- Body - very boxy, upright shape (classic Defender) -->
    <path d="M40 55 L40 162 L380 162 L380 70 L365 55 L280 55 L275 25 L115 25 L110 55 Z" fill="url(#dfBody)"/>

    <!-- Alpine windows (top row, small square windows) -->
    <rect x="118" y="30" width="22" height="12" rx="1" fill="#8b7355" opacity="0.45"/>
    <rect x="148" y="30" width="22" height="12" rx="1" fill="#8b7355" opacity="0.45"/>
    <rect x="178" y="30" width="22" height="12" rx="1" fill="#8b7355" opacity="0.45"/>
    <rect x="208" y="30" width="22" height="12" rx="1" fill="#8b7355" opacity="0.45"/>
    <rect x="238" y="30" width="22" height="12" rx="1" fill="#8b7355" opacity="0.45"/>

    <!-- Windshield (very upright, Defender style) -->
    <path d="M273 28 L278 55 L115 55 L117 28 Z" fill="#8b7355" opacity="0.65"/>
    <!-- Windshield split -->
    <line x1="196" y1="28" x2="196" y2="55" stroke="#30211b" stroke-width="3"/>

    <!-- Main side windows -->
    <rect x="118" y="48" width="30" height="28" rx="2" fill="#8b7355" opacity="0.55"/>
    <rect x="155" y="48" width="30" height="28" rx="2" fill="#8b7355" opacity="0.55"/>
    <rect x="192" y="48" width="30" height="28" rx="2" fill="#8b7355" opacity="0.55"/>
    <rect x="229" y="48" width="30" height="28" rx="2" fill="#8b7355" opacity="0.5"/>

    <!-- Window dividers (strong vertical pillars) -->
    <line x1="148" y1="25" x2="148" y2="80" stroke="#30211b" stroke-width="4"/>
    <line x1="185" y1="25" x2="185" y2="80" stroke="#30211b" stroke-width="4"/>
    <line x1="222" y1="25" x2="222" y2="80" stroke="#30211b" stroke-width="4"/>
    <line x1="259" y1="25" x2="259" y2="80" stroke="#30211b" stroke-width="4"/>

    <!-- Horizontal belt line -->
    <line x1="42" y1="80" x2="378" y2="80" stroke="#3d2b1a" stroke-width="2"/>
    <line x1="42" y1="45" x2="110" y2="45" stroke="#3d2b1a" stroke-width="2"/>

    <!-- Door lines -->
    <line x1="185" y1="55" x2="185" y2="158" stroke="#3d2b1a" stroke-width="1.5"/>
    <line x1="270" y1="55" x2="270" y2="158" stroke="#3d2b1a" stroke-width="1.5"/>

    <!-- Door handles (simple, utilitarian) -->
    <rect x="195" y="100" width="16" height="5" rx="2" fill="#6b5a45"/>
    <rect x="240" y="100" width="16" height="5" rx="2" fill="#6b5a45"/>

    <!-- Hood (flat, boxy) -->
    <rect x="280" y="55" width="85" height="55" fill="#352518" opacity="0.7"/>
    <!-- Hood latch -->
    <rect x="340" y="60" width="3" height="45" fill="#3d2b1a"/>

    <!-- Front grille (distinctive Defender look) -->
    <rect x="370" y="58" width="14" height="90" rx="2" fill="#30211b"/>
    <!-- Grille slats -->
    <line x1="372" y1="68" x2="382" y2="68" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="372" y1="76" x2="382" y2="76" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="372" y1="84" x2="382" y2="84" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="372" y1="92" x2="382" y2="92" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="372" y1="100" x2="382" y2="100" stroke="#5a4a3a" stroke-width="1.5"/>
    <line x1="372" y1="108" x2="382" y2="108" stroke="#5a4a3a" stroke-width="1.5"/>

    <!-- Round headlights (classic Defender) -->
    <circle cx="377" cy="70" r="8" fill="#2a2018"/>
    <circle cx="377" cy="70" r="6" fill="#f5d799" opacity="0.7"/>
    <circle cx="377" cy="70" r="3" fill="#fff5e6" opacity="0.5"/>

    <!-- Indicator lights -->
    <rect x="372" y="115" width="8" height="8" rx="2" fill="#d4792a" opacity="0.6"/>
    <rect x="372" y="130" width="8" height="8" rx="2" fill="#c2442d" opacity="0.5"/>

    <!-- Front bumper (simple steel) -->
    <rect x="368" y="148" width="18" height="10" rx="2" fill="#4a3a2a"/>

    <!-- Rear door (side-hinged, with spare tire) -->
    <rect x="36" y="55" width="12" height="100" rx="2" fill="#2a1c12"/>
    <!-- Rear tail lights -->
    <rect x="37" y="60" width="8" height="14" rx="2" fill="#c2442d" opacity="0.6"/>
    <rect x="37" y="80" width="8" height="10" rx="2" fill="#f5d799" opacity="0.4"/>

    <!-- Spare tire on rear door -->
    <circle cx="30" cy="110" r="25" fill="#1a1410"/>
    <circle cx="30" cy="110" r="20" fill="#2a2018"/>
    <circle cx="30" cy="110" r="16" fill="#333028"/>
    <circle cx="30" cy="110" r="6" fill="#4a4540"/>

    <!-- Wheel arches (square-ish, Defender style) -->
    <path d="M70 130 Q70 106 98 98 Q120 93 142 100 Q162 110 162 130" fill="#1a1410"/>
    <path d="M275 130 Q275 106 303 98 Q325 93 347 100 Q367 110 367 130" fill="#1a1410"/>

    <!-- Rear wheel -->
    <circle cx="115" cy="162" r="28" fill="#1a1410"/>
    <circle cx="115" cy="162" r="23" fill="#2a2018"/>
    <circle cx="115" cy="162" r="18" fill="#383028"/>
    <circle cx="115" cy="162" r="7" fill="#5a5550"/>
    <!-- Wheel bolts (5 lug, Defender style) -->
    <circle cx="115" cy="152" r="2" fill="#6b6560"/>
    <circle cx="124" cy="158" r="2" fill="#6b6560"/>
    <circle cx="121" cy="169" r="2" fill="#6b6560"/>
    <circle cx="109" cy="169" r="2" fill="#6b6560"/>
    <circle cx="106" cy="158" r="2" fill="#6b6560"/>

    <!-- Front wheel -->
    <circle cx="320" cy="162" r="28" fill="#1a1410"/>
    <circle cx="320" cy="162" r="23" fill="#2a2018"/>
    <circle cx="320" cy="162" r="18" fill="#383028"/>
    <circle cx="320" cy="162" r="7" fill="#5a5550"/>
    <circle cx="320" cy="152" r="2" fill="#6b6560"/>
    <circle cx="329" cy="158" r="2" fill="#6b6560"/>
    <circle cx="326" cy="169" r="2" fill="#6b6560"/>
    <circle cx="314" cy="169" r="2" fill="#6b6560"/>
    <circle cx="311" cy="158" r="2" fill="#6b6560"/>

    <!-- Roof rack (expedition style) -->
    <rect x="112" y="19" width="165" height="6" rx="2" fill="#5a4535"/>
    <rect x="115" y="15" width="159" height="4" rx="1" fill="#6b5545"/>
    <!-- Rack bars -->
    <rect x="130" y="19" width="2" height="6" fill="#6b5545"/>
    <rect x="160" y="19" width="2" height="6" fill="#6b5545"/>
    <rect x="190" y="19" width="2" height="6" fill="#6b5545"/>
    <rect x="220" y="19" width="2" height="6" fill="#6b5545"/>
    <rect x="250" y="19" width="2" height="6" fill="#6b5545"/>

    <!-- Side step -->
    <rect x="160" y="156" width="115" height="4" rx="2" fill="#4a3525"/>

    <!-- Chequer plate on lower body -->
    <g opacity="0.15" fill="#6b5a45">
      <rect x="43" y="120" width="6" height="3"/>
      <rect x="52" y="120" width="6" height="3"/>
      <rect x="43" y="126" width="6" height="3"/>
      <rect x="52" y="126" width="6" height="3"/>
      <rect x="43" y="132" width="6" height="3"/>
      <rect x="52" y="132" width="6" height="3"/>
    </g>
  </g>

  <!-- Label -->
  <text x="300" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#6b4c30" font-weight="bold" letter-spacing="2">LAND ROVER DEFENDER</text>
</svg>