<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mmSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1540"/>
      <stop offset="20%" stop-color="#8b3a62"/>
      <stop offset="40%" stop-color="#d4792a"/>
      <stop offset="60%" stop-color="#f5a623"/>
      <stop offset="80%" stop-color="#f7d794"/>
      <stop offset="100%" stop-color="#ffeaa7"/>
    </linearGradient>
    <radialGradient id="mmSun" cx="0.7" cy="0.55" r="0.3">
      <stop offset="0%" stop-color="#fff5e6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f5a623" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mmGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7a42"/>
      <stop offset="40%" stop-color="#6b5a30"/>
      <stop offset="100%" stop-color="#4a3d20"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#mmSky)"/>
  <rect width="800" height="500" fill="url(#mmSun)"/>

  <!-- Sun -->
  <circle cx="560" cy="250" r="45" fill="#ffcc66" opacity="0.9"/>
  <circle cx="560" cy="250" r="38" fill="#fff5e6" opacity="0.6"/>

  <!-- Distant hills -->
  <path d="M0 300 Q100 270 200 285 Q300 260 400 280 Q500 255 600 275 Q700 260 800 280 L800 320 L0 320 Z" fill="#6b3a5e" opacity="0.4"/>

  <!-- Mid hills -->
  <path d="M0 310 Q80 290 180 305 Q280 285 380 300 Q500 280 620 295 Q720 285 800 300 L800 340 L0 340 Z" fill="#7a5030" opacity="0.5"/>

  <!-- Savanna ground -->
  <path d="M0 330 Q200 320 400 330 Q600 325 800 335 L800 500 L0 500 Z" fill="url(#mmGround)"/>

  <!-- Tall grass texture -->
  <g stroke="#9b8a50" stroke-width="1" opacity="0.4">
