  <g transform="translate(200, 370)">
    <path d="M0 0 Q-5 -15 -3 -30 Q0 -40 5 -45 L8 -48 Q12 -50 15 -48 L25 -45 Q30 -40 32 -30 Q35 -20 30 -10 Q25 0 20 5 L18 25 L15 25 L16 5 L10 5 L9 25 L6 25 L8 5 Q3 2 0 0 Z" fill="#30211b" opacity="0.85"/>
    <!-- Horns -->
    <path d="M8 -48 Q5 -55 3 -58" stroke="#30211b" stroke-width="1.5" fill="none"/>
    <path d="M15 -48 Q18 -55 20 -58" stroke="#30211b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Wildebeest 2 -->
  <g transform="translate(260, 375) scale(0.85)">
    <path d="M0 0 Q-5 -15 -3 -30 Q0 -40 5 -45 L8 -48 Q12 -50 15 -48 L25 -45 Q30 -40 32 -30 Q35 -20 30 -10 Q25 0 20 5 L18 25 L15 25 L16 5 L10 5 L9 25 L6 25 L8 5 Q3 2 0 0 Z" fill="#30211b" opacity="0.8"/>
    <path d="M8 -48 Q5 -55 3 -58" stroke="#30211b" stroke-width="1.5" fill="none"/>
    <path d="M15 -48 Q18 -55 20 -58" stroke="#30211b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Wildebeest 3 (walking) -->
  <g transform="translate(310, 378) scale(0.75)">
    <path d="M0 0 Q-5 -15 -3 -30 Q0 -40 5 -45 L8 -48 Q12 -50 15 -48 L25 -45 Q30 -40 32 -30 Q35 -20 30 -10 Q25 0 20 5 L20 25 L17 25 L17 8 L14 5 L11 8 L11 25 L8 25 L7 5 Q3 2 0 0 Z" fill="#30211b" opacity="0.75"/>
    <path d="M8 -48 Q5 -54 3 -57" stroke="#30211b" stroke-width="1.5" fill="none"/>
    <path d="M15 -48 Q18 -54 20 -57" stroke="#30211b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Wildebeest 4 (distant) -->
  <g transform="translate(400, 365) scale(0.55)">
    <path d="M0 0 Q-5 -15 -3 -30 Q0 -40 5 -45 L8 -48 Q12 -50 15 -48 L25 -45 Q30 -40 32 -30 Q35 -20 30 -10 Q25 0 20 5 L18 22 L15 22 L16 5 L10 5 L9 22 L6 22 L8 5 Q3 2 0 0 Z" fill="#30211b" opacity="0.6"/>
    <path d="M8 -48 Q5 -54 4 -56" stroke="#30211b" stroke-width="1" fill="none"/>
    <path d="M15 -48 Q18 -54 19 -56" stroke="#30211b" stroke-width="1" fill="none"/>
  </g>

  <!-- Wildebeest 5 (distant) -->
  <g transform="translate(445, 362) scale(0.5)">
    <path d="M0 0 Q-5 -15 -3 -30 Q0 -40 5 -45 L8 -48 Q12 -50 15 -48 L25 -45 Q30 -40 32 -30 Q35 -20 30 -10 Q25 0 20 5 L18 22 L15 22 L16 5 L10 5 L9 22 L6 22 L8 5 Q3 2 0 0 Z" fill="#30211b" opacity="0.55"/>
  </g>

  <!-- Wildebeest 6 (very distant line) -->
  <g transform="translate(350, 345) scale(0.3)">
    <path d="M0 0 Q-3 -12 0 -30 Q3 -38 8 -42 L15 -42 Q22 -38 25 -30 Q28 -12 20 5 L18 18 L15 18 L16 5 L10 5 L9 18 L6 18 L8 5 Z" fill="#30211b" opacity="0.4"/>
  </g>
  <g transform="translate(370, 343) scale(0.3)">
    <path d="M0 0 Q-3 -12 0 -30 Q3 -38 8 -42 L15 -42 Q22 -38 25 -30 Q28 -12 20 5 L18 18 L15 18 L16 5 L10 5 L9 18 L6 18 L8 5 Z" fill="#30211b" opacity="0.35"/>
  </g>

  <!-- Grass clumps foreground -->
  <g fill="#6b5a30" opacity="0.6">
    <path d="M50 480 Q55 455 52 440 Q60 450 65 480"/>
    <path d="M48 480 Q42 460 46 445 Q38 455 35 480"/>
    <path d="M350 475 Q355 450 352 435 Q360 445 365 475"/>
    <path d="M500 480 Q505 455 502 440 Q510 450 515 480"/>
    <path d="M700 478 Q705 453 702 438 Q710 448 715 478"/>
  </g>

  <!-- Birds -->
  <g stroke="#30211b" stroke-width="1" fill="none" opacity="0.35">
    <path d="M350 180 Q354 176 358 180 Q362 176 366 180"/>
    <path d="M380 170 Q383 167 386 170 Q389 167 392 170"/>
    <path d="M420 185 Q423 182 426 185 Q429 182 432 185"/>
  </g>

  <!-- Text overlay area -->
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f7d794" font-weight="bold" letter-spacing="3" opacity="0.8">MASAI MARA</text>
</svg>