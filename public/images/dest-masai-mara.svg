    <path d="M-1 360 Q-25 340 -55 332" stroke="#30211b" stroke-width="4" fill="none"/>
    <path d="M0 345 Q22 325 50 318" stroke="#30211b" stroke-width="4" fill="none"/>
    <path d="M-1 330 Q-30 310 -65 305" stroke="#30211b" stroke-width="3" fill="none"/>
    <path d="M0 325 Q28 308 60 303" stroke="#30211b" stroke-width="3" fill="none"/>
