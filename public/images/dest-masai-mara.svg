    <line x1="25" y1="500" x2="28" y2="475"/>
    <line x1="30" y1="500" x2="27" y2="468"/>
    <line x1="60" y1="500" x2="63" y2="472"/>
    <line x1="65" y1="500" x2="62" y2="465"/>
    <line x1="100" y1="500" x2="103" y2="468"/>
    <line x1="105" y1="500" x2="102" y2="475"/>
    <line x1="150" y1="500" x2="153" y2="470"/>
    <line x1="200" y1="500" x2="198" y2="465"/>
    <line x1="250" y1="500" x2="253" y2="472"/>
    <line x1="300" y1="500" x2="297" y2="468"/>
    <line x1="350" y1="495" x2="352" y2="465"/>
    <line x1="400" y1="498" x2="403" y2="470"/>
    <line x1="450" y1="500" x2="448" y2="472"/>
    <line x1="500" y1="498" x2="502" y2="468"/>
    <line x1="550" y1="500" x2="553" y2="475"/>
    <line x1="600" y1="498" x2="597" y2="470"/>
    <line x1="650" y1="500" x2="652" y2="472"/>
    <line x1="700" y1="500" x2="698" y2="468"/>
    <line x1="750" y1="498" x2="752" y2="470"/>
    <line x1="780" y1="500" x2="782" y2="475"/>
