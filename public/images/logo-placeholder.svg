<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="logoAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4792a"/>
      <stop offset="100%" stop-color="#b8601e"/>
    </linearGradient>
  </defs>

  <!-- 4x4 Vehicle icon integrated before text -->
  <g transform="translate(12, 22)">
    <!-- Vehicle body -->
    <path d="M0 18 L0 32 L52 32 L52 20 L47 15 L38 15 L35 5 L15 5 L12 15 L5 18 Z" fill="#d4792a"/>
    <!-- Roof rack -->
    <line x1="17" y1="5" x2="33" y2="5" stroke="#b8601e" stroke-width="1.5"/>
    <line x1="18" y1="3" x2="32" y2="3" stroke="#b8601e" stroke-width="1"/>
    <line x1="21" y1="3" x2="21" y2="5" stroke="#b8601e" stroke-width="0.8"/>
    <line x1="25" y1="3" x2="25" y2="5" stroke="#b8601e" stroke-width="0.8"/>
    <line x1="29" y1="3" x2="29" y2="5" stroke="#b8601e" stroke-width="0.8"/>
    <!-- Windshield -->
    <path d="M34 7 L37 15 L14 15 L16 7 Z" fill="#30211b" opacity="0.5"/>
    <!-- Side windows -->
    <rect x="15" y="8" width="8" height="6" rx="1" fill="#30211b" opacity="0.4"/>
    <rect x="25" y="8" width="8" height="6" rx="1" fill="#30211b" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="15" cy="34" r="6" fill="#30211b"/>
    <circle cx="15" cy="34" r="4" fill="#4a3525"/>
    <circle cx="15" cy="34" r="1.5" fill="#6b5a45"/>
    <circle cx="40" cy="34" r="6" fill="#30211b"/>
    <circle cx="40" cy="34" r="4" fill="#4a3525"/>
    <circle cx="40" cy="34" r="1.5" fill="#6b5a45"/>
    <!-- Headlight -->
    <rect x="50" y="20" width="3" height="4" rx="1" fill="#f5d799" opacity="0.7"/>
    <!-- Bull bar -->
    <path d="M52 18 Q56 20 56 26 Q56 30 52 32" fill="none" stroke="#b8601e" stroke-width="1.5"/>
  </g>

  <!-- "SAFARI" text -->
  <text x="78" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#d4792a" letter-spacing="3">SAFARI</text>

  <!-- "RENTALS" text -->
  <text x="78" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#30211b" letter-spacing="5">RENTALS</text>

  <!-- Subtle underline accent -->
  <line x1="78" y1="67" x2="195" y2="67" stroke="#d4792a" stroke-width="1.5" opacity="0.4"/>

  <!-- Kenya tagline -->
  <text x="78" y="76" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#8a7560" letter-spacing="4">KENYA</text>
</svg>