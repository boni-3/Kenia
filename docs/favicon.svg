<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#30211b"/>
  <circle cx="16" cy="16" r="14" fill="#3d2b1a"/>

  <!-- Safari vehicle icon -->
  <g transform="translate(4, 8)">
    <!-- Body -->
    <path d="M2 7 L2 14 L22 14 L22 8 L20 6 L16 6 L14.5 2 L7 2 L5.5 6 L3 7 Z" fill="#d4792a"/>
    <!-- Roof rack -->
    <line x1="7.5" y1="2" x2="14" y2="2" stroke="#b8601e" stroke-width="0.8"/>
    <line x1="8" y1="1" x2="13.5" y2="1" stroke="#b8601e" stroke-width="0.6"/>
    <!-- Windshield -->
    <path d="M14 3 L15.5 6 L6 6 L7.5 3 Z" fill="#30211b" opacity="0.5"/>
    <!-- Windows -->
    <rect x="7" y="3.5" width="3" height="2" rx="0.5" fill="#30211b" opacity="0.4"/>
    <rect x="11" y="3.5" width="3" height="2" rx="0.5" fill="#30211b" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="7" cy="15" r="2.8" fill="#1a1410"/>
    <circle cx="7" cy="15" r="1.8" fill="#333"/>
    <circle cx="7" cy="15" r="0.7" fill="#555"/>
    <circle cx="18" cy="15" r="2.8" fill="#1a1410"/>
    <circle cx="18" cy="15" r="1.8" fill="#333"/>
    <circle cx="18" cy="15" r="0.7" fill="#555"/>
    <!-- Headlight -->
    <rect x="21" y="8" width="1.5" height="2" rx="0.5" fill="#f5d799" opacity="0.8"/>
